<div class="mb-2">
  {% if f.field.widget.input_type == "checkbox" %}
    <div class="form-check">{{ f }} <label class="form-check-label small" for="{{ f.id_for_label }}">{{ f.label }}</label></div>
  {% else %}
    <label class="form-label small mb-0" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
  {% endif %}
  {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
</div>
