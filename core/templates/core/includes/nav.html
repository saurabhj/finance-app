<aside class="sidebar">
  <a class="brand" href="{% url 'dashboard' %}"><span class="dot"></span>Family Finance</a>
  <button class="search-trigger" data-open-palette type="button"><span>Search or jump to…</span><span class="kbd">⌘K</span></button>
  {% for section in nav_sections %}
  <nav>
    <div class="nav-section-title">{{ section.title }}</div>
    {% for item in section.items %}
      <a class="nav-item-link{% if item.active %} active{% endif %}" href="{{ item.url }}" {% if item.key %}title="g then {{ item.key }}"{% endif %}>
        <span>{{ item.label }}</span>{% if item.badge %}<span class="count">{{ item.badge }}</span>{% endif %}
      </a>
    {% endfor %}
  </nav>
  {% endfor %}
  <div class="sidebar-foot">
    <span>{{ user.username }}</span>
    <span>
      <button class="linkish" type="button" onclick="document.getElementById('shortcuts').classList.add('open')" title="Keyboard shortcuts">?</button>
      <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="linkish ms-2">Log out</button></form>
    </span>
  </div>
</aside>
