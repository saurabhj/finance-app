{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Family Finance{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f7f9; }
    .kpi { font-size: 1.6rem; font-weight: 600; }
    .kpi-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; }
    .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .card { border: 0; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% include "core/includes/nav.html" %}
<main class="container py-4">
  {% include "core/includes/messages.html" %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
